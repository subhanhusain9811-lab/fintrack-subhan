<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack Pro - Pencatatan Keuangan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb', // blue-600
                        income: '#059669', // emerald-600
                        expense: '#e11d48', // rose-600
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Scrollbar for tables */
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background-color: #475569; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef, createContext, useContext } = React;

        const CATEGORIES = {
            income: ['Gaji', 'Bonus', 'Penjualan', 'Investasi', 'Hadiah', 'Lainnya'],
            expense: ['Makanan', 'Transportasi', 'Belanja', 'Tagihan', 'Pendidikan', 'Kesehatan', 'Hiburan', 'Rumah Tangga', 'Bisnis', 'Lainnya']
        };

        const PAYMENT_METHODS = ['Tunai', 'Transfer Bank', 'E-Wallet', 'Kartu Debit', 'Kartu Kredit', 'Lainnya'];

        const generateDemoData = () => {
            const now = new Date();
            const data = [];
            const types = ['income', 'expense'];
            
            for(let i = 0; i < 15; i++) {
                const type = i % 4 === 0 ? 'income' : 'expense';
                const date = new Date(now);
                date.setDate(date.getDate() - Math.floor(Math.random() * 45)); // Spread over 45 days
                
                data.push({
                    id: `demo-${Date.now()}-${i}`,
                    type,
                    date: date.toISOString().split('T')[0],
                    time: `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`,
                    category: CATEGORIES[type][Math.floor(Math.random() * CATEGORIES[type].length)],
                    description: `Transaksi Demo ${i + 1}`,
                    amount: type === 'income' ? (Math.floor(Math.random() * 50) + 10) * 100000 : (Math.floor(Math.random() * 20) + 1) * 20000,
                    paymentMethod: PAYMENT_METHODS[Math.floor(Math.random() * PAYMENT_METHODS.length)],
                    notes: 'Data dummy otomatis',
                    createdAt: date.toISOString(),
                    updatedAt: null
                });
            }
            return data.sort((a, b) => new Date(b.date) - new Date(a.date));
        };

        const formatIDR = (amount) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
        };

        const formatDate = (dateString, withTime = false) => {
            if (!dateString) return '-';
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            if (withTime) {
                options.hour = '2-digit';
                options.minute = '2-digit';
            }
            return new Intl.DateTimeFormat('id-ID', options).format(new Date(dateString));
        };

        const Icons = {
            Home: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            List: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
            PieChart: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            Settings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Sun: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
            Moon: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
            TrendingUp: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            TrendingDown: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>,
            Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Search: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            Filter: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        };

        const UIContext = createContext();

        const UIProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

            const showToast = useCallback((message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            }, []);

            const confirm = useCallback((title, message, onConfirm) => {
                setModal({ isOpen: true, title, message, onConfirm });
            }, []);

            const closeModal = () => setModal({ isOpen: false, title: '', message: '', onConfirm: null });

            return (
                <UIContext.Provider value={{ showToast, confirm }}>
                    {children}
                    
                    {/* Toast Renderer */}
                    <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`flex items-center px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium transition-all duration-300 translate-y-0 opacity-100 ${toast.type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
                                {toast.type === 'success' ? <span className="mr-2">✓</span> : <span className="mr-2">⚠</span>}
                                {toast.message}
                            </div>
                        ))}
                    </div>

                    {/* Modal Renderer */}
                    {modal.isOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-slate-800 rounded-xl shadow-xl w-full max-w-sm overflow-hidden border border-slate-200 dark:border-slate-700 animate-in fade-in zoom-in-95 duration-200">
                                <div className="p-5">
                                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-2">{modal.title}</h3>
                                    <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">{modal.message}</p>
                                    <div className="flex justify-end gap-3">
                                        <button onClick={closeModal} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">Batal</button>
                                        <button 
                                            onClick={() => { modal.onConfirm(); closeModal(); }} 
                                            className="px-4 py-2 rounded-lg text-sm font-medium bg-rose-600 hover:bg-rose-700 text-white transition-colors"
                                        >Ya, Lanjutkan</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </UIContext.Provider>
            );
        };

        const useUI = () => useContext(UIContext);

        const PieChart = ({ data, colors, labels }) => {
            const canvasRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = canvasRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels,
                        datasets: [{ data, backgroundColor: colors, borderWidth: 0 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '75%',
                        plugins: {
                            legend: { position: 'right', labels: { color: document.documentElement.classList.contains('dark') ? '#cbd5e1' : '#475569', font: { family: 'Inter', size: 12 } } },
                            tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${formatIDR(ctx.raw)}` } }
                        }
                    }
                });
                return () => chartInstance.current?.destroy();
            }, [data, colors, labels]);

            return <div className="relative h-64 w-full"><canvas ref={canvasRef}></canvas></div>;
        };

        const BarChart = ({ labels, incomeData, expenseData }) => {
            const canvasRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = canvasRef.current.getContext('2d');
                
                const isDark = document.documentElement.classList.contains('dark');
                const textColor = isDark ? '#cbd5e1' : '#64748b';
                const gridColor = isDark ? '#334155' : '#e2e8f0';

                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [
                            { label: 'Pemasukan', data: incomeData, backgroundColor: '#059669', borderRadius: 4 },
                            { label: 'Pengeluaran', data: expenseData, backgroundColor: '#e11d48', borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: textColor } },
                            y: { grid: { color: gridColor }, ticks: { color: textColor, callback: val => formatIDR(val).replace(',00', '') } }
                        },
                        plugins: {
                            legend: { position: 'top', labels: { color: textColor } },
                            tooltip: { callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${formatIDR(ctx.raw)}` } }
                        }
                    }
                });
                return () => chartInstance.current?.destroy();
            }, [labels, incomeData, expenseData]);

            return <div className="relative h-72 w-full"><canvas ref={canvasRef}></canvas></div>;
        };

        const TransactionForm = ({ isOpen, onClose, onSave, editData = null }) => {
            const { showToast } = useUI();
            
            // Initial form state
            const [formData, setFormData] = useState({
                type: 'expense',
                date: new Date().toISOString().split('T')[0],
                time: `${String(new Date().getHours()).padStart(2, '0')}:${String(new Date().getMinutes()).padStart(2, '0')}`,
                category: CATEGORIES.expense[0],
                description: '',
                amount: '',
                paymentMethod: PAYMENT_METHODS[0],
                notes: ''
            });

            // Reset or populate form when opened
            useEffect(() => {
                if (isOpen) {
                    if (editData) {
                        setFormData({ ...editData, amount: editData.amount.toString() });
                    } else {
                        const now = new Date();
                        setFormData({
                            type: 'expense',
                            date: now.toISOString().split('T')[0],
                            time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
                            category: CATEGORIES.expense[0],
                            description: '',
                            amount: '',
                            paymentMethod: PAYMENT_METHODS[0],
                            notes: ''
                        });
                    }
                }
            }, [isOpen, editData]);

            // Handle Type Change to reset Category
            useEffect(() => {
                if (!editData) {
                    setFormData(prev => ({ ...prev, category: CATEGORIES[prev.type][0] }));
                }
            }, [formData.type, editData]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const amount = Number(formData.amount);
                
                // Validations
                if (!formData.date) return showToast('Tanggal wajib diisi', 'error');
                if (!formData.category) return showToast('Kategori wajib dipilih', 'error');
                if (!amount || amount <= 0) return showToast('Nominal harus lebih besar dari 0', 'error');

                const now = new Date().toISOString();
                
                const finalData = {
                    ...formData,
                    amount,
                    id: editData ? editData.id : `txn-${Date.now()}`,
                    createdAt: editData ? editData.createdAt : now,
                    updatedAt: editData ? now : null
                };

                onSave(finalData);
                onClose();
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-40 flex items-center justify-center p-4 sm:p-6 bg-slate-900/50 backdrop-blur-sm overflow-y-auto">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-200 dark:border-slate-700 my-auto animate-in fade-in slide-in-from-bottom-4 duration-300">
                        <div className="flex items-center justify-between p-5 border-b border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
                            <h2 className="text-xl font-bold text-slate-800 dark:text-white">{editData ? 'Edit Transaksi' : 'Tambah Transaksi'}</h2>
                            <button onClick={onClose} className="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition text-slate-500 dark:text-slate-400">
                                <Icons.X />
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-5 space-y-4">
                            {/* Type Switcher */}
                            <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl">
                                <button type="button" onClick={() => handleChange({ target: { name: 'type', value: 'income' }})} 
                                    className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${formData.type === 'income' ? 'bg-white dark:bg-slate-700 text-emerald-600 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                                    Pemasukan
                                </button>
                                <button type="button" onClick={() => handleChange({ target: { name: 'type', value: 'expense' }})} 
                                    className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${formData.type === 'expense' ? 'bg-white dark:bg-slate-700 text-rose-600 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                                    Pengeluaran
                                </button>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Tanggal *</label>
                                    <input type="date" name="date" value={formData.date} onChange={handleChange} required
                                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-primary outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Waktu</label>
                                    <input type="time" name="time" value={formData.time} onChange={handleChange}
                                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-primary outline-none" />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Kategori *</label>
                                    <select name="category" value={formData.category} onChange={handleChange} required
                                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-primary outline-none">
                                        {CATEGORIES[formData.type].map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Metode Pembayaran</label>
                                    <select name="paymentMethod" value={formData.paymentMethod} onChange={handleChange}
                                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-primary outline-none">
                                        {PAYMENT_METHODS.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Deskripsi</label>
                                <input type="text" name="description" value={formData.description} onChange={handleChange} placeholder="Contoh: Beli makan siang"
                                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-primary outline-none" />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Nominal (Rp) *</label>
                                <input type="number" name="amount" value={formData.amount} onChange={handleChange} placeholder="50000" required min="1"
                                    className="w-full px-3 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-lg font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-primary outline-none placeholder:font-normal placeholder:text-sm" />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Catatan Tambahan (Opsional)</label>
                                <textarea name="notes" value={formData.notes} onChange={handleChange} rows="2"
                                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-primary outline-none resize-none"></textarea>
                            </div>

                            <div className="pt-4 flex gap-3">
                                <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-xl font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                                    Batal
                                </button>
                                <button type="submit" className="flex-1 py-2.5 rounded-xl font-semibold text-white bg-primary hover:bg-blue-700 shadow-md transition">
                                    Simpan Transaksi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            // State
            const [transactions, setTransactions] = useState([]);
            const [theme, setTheme] = useState('light');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [editingTx, setEditingTx] = useState(null);
            
            const { showToast, confirm } = useUI();

            // Load Data & Theme on Mount
            useEffect(() => {
                const savedData = localStorage.getItem('fintrack_data');
                if (savedData) {
                    setTransactions(JSON.parse(savedData));
                }

                const savedTheme = localStorage.getItem('fintrack_theme') || 'light';
                setTheme(savedTheme);
                if (savedTheme === 'dark') document.documentElement.classList.add('dark');
            }, []);

            // Save Data & Theme on Change
            useEffect(() => {
                localStorage.setItem('fintrack_data', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('fintrack_theme', theme);
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

            const handleSaveTransaction = (data) => {
                if (editingTx) {
                    setTransactions(prev => prev.map(t => t.id === data.id ? data : t).sort((a, b) => new Date(b.date) - new Date(a.date)));
                    showToast('Transaksi berhasil diperbarui');
                } else {
                    setTransactions(prev => [data, ...prev].sort((a, b) => new Date(b.date) - new Date(a.date)));
                    showToast('Transaksi berhasil ditambahkan');
                }
                setEditingTx(null);
            };

            const handleEdit = (tx) => {
                setEditingTx(tx);
                setIsFormOpen(true);
            };

            const handleDelete = (id) => {
                confirm('Hapus Transaksi', 'Apakah Anda yakin ingin menghapus transaksi ini? Data yang dihapus tidak dapat dikembalikan.', () => {
                    setTransactions(prev => prev.filter(t => t.id !== id));
                    showToast('Transaksi berhasil dihapus');
                });
            };

            const handleClearAll = () => {
                confirm('Hapus Semua Data', 'PERINGATAN: Anda akan menghapus seluruh data transaksi. Lanjutkan?', () => {
                    setTransactions([]);
                    showToast('Semua data berhasil dihapus');
                });
            };

            const loadDemoData = () => {
                confirm('Muat Data Demo', 'Ini akan menimpa data Anda saat ini dengan data demo. Lanjutkan?', () => {
                    setTransactions(generateDemoData());
                    showToast('Data demo berhasil dimuat');
                });
            };

            const stats = useMemo(() => {
                let totalIncome = 0;
                let totalExpense = 0;
                
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                
                let monthIncome = 0;
                let monthExpense = 0;
                
                const categoryExpenseMap = {};

                transactions.forEach(t => {
                    const amount = Number(t.amount);
                    const txDate = new Date(t.date);
                    const isCurrentMonth = txDate.getMonth() === currentMonth && txDate.getFullYear() === currentYear;

                    if (t.type === 'income') {
                        totalIncome += amount;
                        if (isCurrentMonth) monthIncome += amount;
                    } else {
                        totalExpense += amount;
                        if (isCurrentMonth) monthExpense += amount;
                        
                        // Category aggregation for current month pie chart (or all time if preferred)
                        categoryExpenseMap[t.category] = (categoryExpenseMap[t.category] || 0) + amount;
                    }
                });

                // Top Categories Data for Pie Chart
                const sortedCategories = Object.entries(categoryExpenseMap).sort((a, b) => b[1] - a[1]);
                const pieLabels = sortedCategories.slice(0, 5).map(i => i[0]);
                const pieData = sortedCategories.slice(0, 5).map(i => i[1]);
                if (sortedCategories.length > 5) {
                    pieLabels.push('Lainnya');
                    pieData.push(sortedCategories.slice(5).reduce((sum, item) => sum + item[1], 0));
                }

                // Monthly Trend for Bar Chart (Last 6 months)
                const monthLabels = [];
                const incData = [];
                const expData = [];
                
                for(let i=5; i>=0; i--) {
                    const d = new Date(currentYear, currentMonth - i, 1);
                    monthLabels.push(new Intl.DateTimeFormat('id-ID', { month: 'short' }).format(d));
                    
                    const mInc = transactions.filter(t => t.type === 'income' && new Date(t.date).getMonth() === d.getMonth() && new Date(t.date).getFullYear() === d.getFullYear()).reduce((sum, t) => sum + Number(t.amount), 0);
                    const mExp = transactions.filter(t => t.type === 'expense' && new Date(t.date).getMonth() === d.getMonth() && new Date(t.date).getFullYear() === d.getFullYear()).reduce((sum, t) => sum + Number(t.amount), 0);
                    
                    incData.push(mInc);
                    expData.push(mExp);
                }

                return {
                    balance: totalIncome - totalExpense,
                    totalIncome,
                    totalExpense,
                    monthIncome,
                    monthExpense,
                    count: transactions.length,
                    pieLabels,
                    pieData,
                    monthLabels,
                    incData,
                    expData,
                    sortedCategories
                };
            }, [transactions]);

            const renderDashboard = () => (
                <div className="space-y-6 animate-in fade-in duration-300">
                    {/* Header Stats */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                            <p className="text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">Saldo Saat Ini</p>
                            <h3 className="text-3xl font-bold text-slate-800 dark:text-white">{formatIDR(stats.balance)}</h3>
                        </div>
                        <div className="bg-emerald-50 dark:bg-emerald-900/20 p-6 rounded-2xl shadow-sm border border-emerald-100 dark:border-emerald-800/50">
                            <p className="text-sm font-medium text-emerald-600 dark:text-emerald-400 mb-1">Pemasukan Bulan Ini</p>
                            <h3 className="text-2xl font-bold text-emerald-700 dark:text-emerald-300">{formatIDR(stats.monthIncome)}</h3>
                            <p className="text-xs text-emerald-600/70 dark:text-emerald-400/70 mt-2">Total Semua: {formatIDR(stats.totalIncome)}</p>
                        </div>
                        <div className="bg-rose-50 dark:bg-rose-900/20 p-6 rounded-2xl shadow-sm border border-rose-100 dark:border-rose-800/50">
                            <p className="text-sm font-medium text-rose-600 dark:text-rose-400 mb-1">Pengeluaran Bulan Ini</p>
                            <h3 className="text-2xl font-bold text-rose-700 dark:text-rose-300">{formatIDR(stats.monthExpense)}</h3>
                            <p className="text-xs text-rose-600/70 dark:text-rose-400/70 mt-2">Total Semua: {formatIDR(stats.totalExpense)}</p>
                        </div>
                    </div>

                    {/* Charts Row */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                            <h3 className="text-base font-semibold text-slate-800 dark:text-white mb-4">Aktivitas 6 Bulan Terakhir</h3>
                            {transactions.length > 0 ? (
                                <BarChart labels={stats.monthLabels} incomeData={stats.incData} expenseData={stats.expData} />
                            ) : (
                                <div className="h-72 flex items-center justify-center text-slate-400 text-sm">Belum ada data</div>
                            )}
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                            <h3 className="text-base font-semibold text-slate-800 dark:text-white mb-4">Kategori Pengeluaran</h3>
                            {stats.pieData.length > 0 ? (
                                <PieChart 
                                    data={stats.pieData} 
                                    labels={stats.pieLabels} 
                                    colors={['#e11d48', '#f59e0b', '#3b82f6', '#8b5cf6', '#14b8a6', '#64748b']} 
                                />
                            ) : (
                                <div className="h-64 flex items-center justify-center text-slate-400 text-sm">Belum ada pengeluaran</div>
                            )}
                        </div>
                    </div>

                    {/* Recent Transactions Preview */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                        <div className="p-5 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                            <h3 className="text-base font-semibold text-slate-800 dark:text-white">Transaksi Terbaru</h3>
                            <button onClick={() => setActiveTab('transactions')} className="text-sm font-medium text-primary hover:underline">Lihat Semua</button>
                        </div>
                        <div className="divide-y divide-slate-100 dark:divide-slate-700">
                            {transactions.length === 0 ? (
                                <div className="p-8 text-center text-slate-500 text-sm">Belum ada transaksi dicatat.</div>
                            ) : (
                                transactions.slice(0, 5).map(tx => (
                                    <div key={tx.id} className="p-4 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/50 transition">
                                        <div className="flex flex-col">
                                            <span className="font-semibold text-sm text-slate-800 dark:text-slate-200">{tx.description || tx.category}</span>
                                            <span className="text-xs text-slate-500 dark:text-slate-400">{formatDate(tx.date)} • {tx.category}</span>
                                        </div>
                                        <span className={`font-bold text-sm ${tx.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-800 dark:text-white'}`}>
                                            {tx.type === 'income' ? '+' : '-'}{formatIDR(tx.amount)}
                                        </span>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );

            const TransactionView = () => {
                const [filterType, setFilterType] = useState('all');
                const [searchQuery, setSearchQuery] = useState('');
                const [sortBy, setSortBy] = useState('newest');

                const filteredTransactions = useMemo(() => {
                    let result = [...transactions];
                    
                    if (filterType !== 'all') {
                        result = result.filter(t => t.type === filterType);
                    }
                    
                    if (searchQuery) {
                        const q = searchQuery.toLowerCase();
                        result = result.filter(t => 
                            (t.description || '').toLowerCase().includes(q) || 
                            t.category.toLowerCase().includes(q) ||
                            t.paymentMethod.toLowerCase().includes(q)
                        );
                    }

                    if (sortBy === 'newest') result.sort((a, b) => new Date(b.date) - new Date(a.date) || new Date(b.createdAt) - new Date(a.createdAt));
                    if (sortBy === 'oldest') result.sort((a, b) => new Date(a.date) - new Date(b.date) || new Date(a.createdAt) - new Date(b.createdAt));
                    if (sortBy === 'highest') result.sort((a, b) => b.amount - a.amount);
                    if (sortBy === 'lowest') result.sort((a, b) => a.amount - b.amount);

                    return result;
                }, [transactions, filterType, searchQuery, sortBy]);

                return (
                    <div className="space-y-4 animate-in fade-in duration-300">
                        {/* Toolbar */}
                        <div className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row gap-4 items-center justify-between">
                            <div className="relative w-full sm:max-w-xs">
                                <div className="absolute inset-y-0 left-3 flex items-center text-slate-400"><Icons.Search /></div>
                                <input type="text" placeholder="Cari transaksi..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none" />
                            </div>
                            
                            <div className="flex gap-2 w-full sm:w-auto overflow-x-auto hide-scrollbar pb-1 sm:pb-0">
                                <select value={filterType} onChange={e => setFilterType(e.target.value)} className="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm outline-none">
                                    <option value="all">Semua Jenis</option>
                                    <option value="income">Pemasukan</option>
                                    <option value="expense">Pengeluaran</option>
                                </select>
                                <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm outline-none">
                                    <option value="newest">Terbaru</option>
                                    <option value="oldest">Terlama</option>
                                    <option value="highest">Nominal Terbesar</option>
                                    <option value="lowest">Nominal Terkecil</option>
                                </select>
                            </div>
                        </div>

                        {/* Data Table / Cards */}
                        <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                            <div className="overflow-x-auto custom-scroll">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-slate-50 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700">
                                        <tr>
                                            <th className="p-4 font-semibold">Tgl & Waktu</th>
                                            <th className="p-4 font-semibold">Kategori</th>
                                            <th className="p-4 font-semibold">Deskripsi</th>
                                            <th className="p-4 font-semibold">Metode</th>
                                            <th className="p-4 font-semibold text-right">Nominal</th>
                                            <th className="p-4 font-semibold text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700/50">
                                        {filteredTransactions.length === 0 ? (
                                            <tr><td colSpan="6" className="p-8 text-center text-slate-500">Tidak ada transaksi ditemukan.</td></tr>
                                        ) : (
                                            filteredTransactions.map(tx => (
                                                <tr key={tx.id} className="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition group">
                                                    <td className="p-4">
                                                        <div className="font-medium text-slate-800 dark:text-slate-200">{formatDate(tx.date)}</div>
                                                        <div className="text-xs text-slate-500 mt-0.5">{tx.time}</div>
                                                    </td>
                                                    <td className="p-4">
                                                        <span className={`inline-flex px-2 py-1 rounded text-xs font-medium ${tx.type === 'income' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300' : 'bg-rose-100 text-rose-800 dark:bg-rose-900/30 dark:text-rose-300'}`}>
                                                            {tx.category}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 max-w-[200px] truncate text-slate-600 dark:text-slate-300" title={tx.description || '-'}>{tx.description || '-'}</td>
                                                    <td className="p-4 text-slate-500 text-xs">{tx.paymentMethod}</td>
                                                    <td className={`p-4 text-right font-bold ${tx.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-800 dark:text-slate-200'}`}>
                                                        {tx.type === 'income' ? '+' : '-'}{formatIDR(tx.amount)}
                                                    </td>
                                                    <td className="p-4">
                                                        <div className="flex items-center justify-center gap-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                                            <button onClick={() => handleEdit(tx)} className="p-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:hover:bg-blue-800/50 dark:text-blue-400 rounded transition" title="Edit">
                                                                <Icons.Edit />
                                                            </button>
                                                            <button onClick={() => handleDelete(tx.id)} className="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 dark:bg-rose-900/30 dark:hover:bg-rose-800/50 dark:text-rose-400 rounded transition" title="Hapus">
                                                                <Icons.Trash />
                                                            </button>
                                                        </div>
                                                        {tx.updatedAt && <div className="text-[10px] text-slate-400 text-center mt-1 hidden sm:block" title={`Diedit: ${formatDate(tx.updatedAt, true)}`}>Edited</div>}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            const RecapView = () => (
                <div className="space-y-6 animate-in fade-in duration-300">
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <h2 className="text-lg font-bold text-slate-800 dark:text-white mb-6">Ringkasan Statistik Keseluruhan</h2>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                            <div>
                                <p className="text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Total Pemasukan</p>
                                <p className="text-xl font-bold text-emerald-600 dark:text-emerald-400">{formatIDR(stats.totalIncome)}</p>
                            </div>
                            <div>
                                <p className="text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Total Pengeluaran</p>
                                <p className="text-xl font-bold text-rose-600 dark:text-rose-400">{formatIDR(stats.totalExpense)}</p>
                            </div>
                            <div>
                                <p className="text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Selisih Bersih</p>
                                <p className={`text-xl font-bold ${stats.balance >= 0 ? 'text-primary' : 'text-rose-500'}`}>{formatIDR(stats.balance)}</p>
                            </div>
                            <div>
                                <p className="text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Total Transaksi</p>
                                <p className="text-xl font-bold text-slate-800 dark:text-white">{stats.count} <span className="text-sm font-normal text-slate-500">entri</span></p>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <h3 className="text-base font-semibold text-slate-800 dark:text-white mb-4">Pengeluaran Terbesar per Kategori</h3>
                        <div className="space-y-4">
                            {stats.sortedCategories.length === 0 ? <p className="text-sm text-slate-500">Belum ada data.</p> : 
                                stats.sortedCategories.map(([cat, amount], idx) => {
                                    const percentage = ((amount / stats.totalExpense) * 100).toFixed(1);
                                    return (
                                        <div key={cat} className="flex items-center">
                                            <div className="w-8 font-mono text-sm text-slate-400">#{idx+1}</div>
                                            <div className="flex-1">
                                                <div className="flex justify-between mb-1">
                                                    <span className="text-sm font-medium text-slate-800 dark:text-slate-200">{cat}</span>
                                                    <span className="text-sm font-bold text-slate-800 dark:text-white">{formatIDR(amount)}</span>
                                                </div>
                                                <div className="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2">
                                                    <div className="bg-rose-500 h-2 rounded-full" style={{ width: `${percentage}%` }}></div>
                                                </div>
                                            </div>
                                            <div className="w-16 text-right text-xs font-medium text-slate-500 pl-2">{percentage}%</div>
                                        </div>
                                    )
                                })
                            }
                        </div>
                    </div>
                </div>
            );

            const SettingsView = () => {
                const handleExport = () => {
                    const dataStr = JSON.stringify(transactions, null, 2);
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `fintrack-backup-${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('Data berhasil diekspor');
                };

                const handleImport = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const imported = JSON.parse(event.target.result);
                            if (Array.isArray(imported)) {
                                confirm('Import Data', 'Data saat ini akan digabungkan dengan data import. Lanjutkan?', () => {
                                    // Basic merge preventing exact duplicate IDs
                                    const existingIds = new Set(transactions.map(t => t.id));
                                    const newTxs = imported.filter(t => !existingIds.has(t.id));
                                    setTransactions(prev => [...newTxs, ...prev].sort((a, b) => new Date(b.date) - new Date(a.date)));
                                    showToast(`${newTxs.length} transaksi berhasil diimport`);
                                });
                            }
                        } catch (err) {
                            showToast('Gagal membaca file JSON', 'error');
                        }
                    };
                    reader.readAsText(file);
                    e.target.value = null; // reset input
                };

                return (
                    <div className="space-y-6 animate-in fade-in duration-300">
                        <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                            <h2 className="text-lg font-bold text-slate-800 dark:text-white">Manajemen Data</h2>
                            <p className="text-sm text-slate-500">Data Anda tersimpan dengan aman di browser (LocalStorage). Anda dapat mencadangkan (Backup) data secara berkala.</p>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4">
                                <button onClick={handleExport} className="flex flex-col items-center justify-center p-4 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700/50 transition">
                                    <span className="font-semibold text-primary mb-1">Export Data (JSON)</span>
                                    <span className="text-xs text-slate-500">Unduh cadangan data</span>
                                </button>
                                
                                <label className="flex flex-col items-center justify-center p-4 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700/50 transition cursor-pointer">
                                    <span className="font-semibold text-emerald-600 mb-1">Import Data</span>
                                    <span className="text-xs text-slate-500">Pulihkan dari file JSON</span>
                                    <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                                </label>
                            </div>
                        </div>

                        <div className="bg-rose-50 dark:bg-rose-900/10 p-6 rounded-2xl border border-rose-100 dark:border-rose-900/50 space-y-4">
                            <h2 className="text-lg font-bold text-rose-700 dark:text-rose-400">Zona Berbahaya</h2>
                            <div className="flex flex-col sm:flex-row gap-3">
                                <button onClick={loadDemoData} className="px-4 py-2 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 transition">
                                    Muat Data Demo
                                </button>
                                <button onClick={handleClearAll} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
                                    Hapus Seluruh Data
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar / Bottom Nav */}
                    <nav className="w-full h-16 fixed bottom-0 z-30 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 md:relative md:w-64 md:h-full md:border-r md:border-t-0 flex md:flex-col justify-around md:justify-start px-2 py-2 md:p-4">
                        <div className="hidden md:flex items-center gap-3 px-4 py-4 mb-6">
                            <div className="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white font-bold text-lg">F</div>
                            <span className="font-bold text-xl tracking-tight">FinTrack Pro</span>
                        </div>

                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:px-4 md:py-3 rounded-xl transition-colors ${activeTab === 'dashboard' ? 'text-primary md:bg-blue-50 dark:md:bg-blue-900/20' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}`}>
                            <Icons.Home /> <span className="text-[10px] md:text-sm font-medium">Dashboard</span>
                        </button>
                        <button onClick={() => setActiveTab('transactions')} className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:px-4 md:py-3 rounded-xl transition-colors ${activeTab === 'transactions' ? 'text-primary md:bg-blue-50 dark:md:bg-blue-900/20' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}`}>
                            <Icons.List /> <span className="text-[10px] md:text-sm font-medium">Transaksi</span>
                        </button>
                        <button onClick={() => setActiveTab('recap')} className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:px-4 md:py-3 rounded-xl transition-colors ${activeTab === 'recap' ? 'text-primary md:bg-blue-50 dark:md:bg-blue-900/20' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}`}>
                            <Icons.PieChart /> <span className="text-[10px] md:text-sm font-medium">Rekap</span>
                        </button>
                        <button onClick={() => setActiveTab('settings')} className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:px-4 md:py-3 rounded-xl transition-colors ${activeTab === 'settings' ? 'text-primary md:bg-blue-50 dark:md:bg-blue-900/20' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}`}>
                            <Icons.Settings /> <span className="text-[10px] md:text-sm font-medium">Setelan</span>
                        </button>

                        <div className="hidden md:block mt-auto pb-4 px-4">
                            <button onClick={toggleTheme} className="flex items-center gap-3 text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors text-sm font-medium">
                                {theme === 'light' ? <Icons.Moon /> : <Icons.Sun />} {theme === 'light' ? 'Mode Gelap' : 'Mode Terang'}
                            </button>
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden bg-slate-50/50 dark:bg-slate-900/50 pb-16 md:pb-0">
                        {/* Topbar */}
                        <header className="h-16 flex items-center justify-between px-4 sm:px-8 border-b border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md z-20">
                            <h1 className="text-xl font-bold capitalize">{activeTab === 'transactions' ? 'Riwayat Transaksi' : activeTab === 'recap' ? 'Rekap Keuangan' : activeTab === 'settings' ? 'Setelan' : 'Dashboard'}</h1>
                            
                            <div className="flex items-center gap-3">
                                <button onClick={toggleTheme} className="p-2 md:hidden text-slate-500 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
                                    {theme === 'light' ? <Icons.Moon /> : <Icons.Sun />}
                                </button>
                                <button onClick={() => { setEditingTx(null); setIsFormOpen(true); }} className="flex items-center gap-2 bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm shadow-blue-500/30 transition-all">
                                    <Icons.Plus /> <span className="hidden sm:inline">Tambah Transaksi</span>
                                </button>
                            </div>
                        </header>

                        {/* Scrollable Content */}
                        <div className="flex-1 overflow-y-auto p-4 sm:p-8 custom-scroll">
                            <div className="max-w-6xl mx-auto">
                                {activeTab === 'dashboard' && renderDashboard()}
                                {activeTab === 'transactions' && <TransactionView />}
                                {activeTab === 'recap' && <RecapView />}
                                {activeTab === 'settings' && <SettingsView />}
                            </div>
                        </div>
                    </main>

                    {/* Modals */}
                    <TransactionForm 
                        isOpen={isFormOpen} 
                        onClose={() => { setIsFormOpen(false); setEditingTx(null); }} 
                        onSave={handleSaveTransaction} 
                        editData={editingTx} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <UIProvider>
                <App />
            </UIProvider>
        );
    </script>
</body>
</html>
